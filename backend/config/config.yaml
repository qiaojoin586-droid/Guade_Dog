# ============================================================
# 导盲AI智能体 - 非敏感配置 (可提交到代码仓库)
#
# 职责划分:
#   * 本文件: 非敏感、结构化的普通配置 (名称/端口/模型/超时等)
#   * backend/.env: 敏感配置 (SECRET_KEY、密码、API key 等, 已被 .gitignore 排除)
#   * 优先级: 环境变量(系统 > .env) > 本文件 > 内置默认值
#
# 修改配置: 非敏感项改这里, 敏感项改 backend/.env
# ============================================================

# ===== 应用基础 =====
app:
  name: guide-dog-ai            # 应用名称(仅日志展示)
  debug: true                   # 调试模式: true 时 SQLAlchemy 打印全部 SQL
  api_v1_prefix: /api/v1        # API 版本前缀(预留)

# ===== 数据库 (MySQL 8) =====
# 账号密码属敏感信息 → 在 .env 配置 MYSQL_USER / MYSQL_PASSWORD
database:
  host: localhost
  port: 3306
  db: guide_dog
  charset: utf8mb4

# ===== 对象存储 (MinIO) =====
# ACCESS_KEY / SECRET_KEY 属敏感信息 → 在 .env 配置
minio:
  endpoint: localhost:9000
  bucket: guide-dog-assets

# ===== 模型选择 =====
# 起步阶段只使用三个大模型：
#   * 讯飞 ASR      —— 语音转文字（IAT 实时转写, API key 在 .env 配置 XFYUN_*）
#   * 阿里云千问    —— 核心调度 LLM（意图判断/对话, API key 在 .env 配置 DASHSCOPE_API_KEY）
#   * 讯飞 TTS      —— 语音合成播报（与 ASR 共用 XFYUN_* 凭据）
# 所有 API key 属敏感信息 → 在 .env 配置
models:
  provider: dashscope                 # LLM 供应商: dashscope(阿里千问) | spark(讯飞星火备用)
  dashscope: qwen3.7-flash
  dashscope_vision: qwen3.7-flash
  spark_url: wss://spark-api.xf-yun.com/v4.0/chat   # Spark Ultra-32K(备用)
  spark_domain: 4.0Ultra
  spark_timeout_seconds: 30

# ===== 语音 (讯飞 ASR/TTS) =====
# 凭据属敏感信息 → 在 .env 配置 XFYUN_APP_ID / XFYUN_API_KEY / XFYUN_API_SECRET
speech:
  asr_url: wss://iat-api.xfyun.cn/v2/iat   # 语音听写(中文)
  tts_url: wss://tts-api.xfyun.cn/v2/tts   # 语音合成
  sample_rate: 16000                        # 讯飞要求 16k 16bit 单声道 PCM
  asr_timeout_seconds: 15
  tts_timeout_seconds: 15
  max_upload_bytes: 5242880                 # 前端上传音频上限 5MB

# ===== JWT =====
# JWT_SECRET_KEY 属敏感信息 → 在 .env 配置
jwt:
  algorithm: HS256
  access_expire_minutes: 15
  refresh_expire_days: 7

# ===== WebSocket =====
websocket:
  heartbeat_interval: 30
  reconnect_delay: 3
